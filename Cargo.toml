[workspace]
resolver = "2"
members = [
  "programs/norr-boards",
  "programs/norr-claim",
  "programs/norr-fees",
  "programs/norr-launch",
  "programs/norr-market",
  "programs/norr-social",
  "programs/norr-wrap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
