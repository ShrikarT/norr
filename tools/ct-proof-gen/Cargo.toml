[workspace]

[package]
name = "ct-proof-gen"
version = "0.1.0"
edition = "2021"
description = "Official solana-zk-sdk 7.0.1 proof generation for Token-2022 confidential transfer"
publish = false

[dependencies]
anyhow = "1"
bs58 = "0.5"
bytemuck = "1"
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-zk-sdk = "7.0.1"
solana-zk-elgamal-proof-interface = "0.1.0"
